name: Q4 Archive Java datée
on: [push]

permissions:
  contents: write

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  archive-q4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Créer Q4_archive_date.txt
        run: |
          if [ -f Q4.java ]; then
            DATE=$(date +%d-%m-%Y)
            FICHIER="Q4_archive_${DATE}.txt"
            {
              echo "Yann AGBEHONOU"
              cat Q4.java
            } > "$FICHIER"
          fi

      - name: Commit et push
        run: |
          git config --global user.name "yannAGB"
          git config --global user.email "yannagbehonou@gmail.com"
          git add Q4_archive_*.txt
          git diff --cached --quiet || (git commit -m "Q4: ajout archive datée" && git pull --rebase && git push)
